<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-primary text-white py-4 mb-4">
        <div class="container"><!-- centraliza e delimita o tamanho do header -->
            <h1 class="h3 mb-3">Acervo Estudantil</h1>
            <!-- o h3 é usado para formatar o texto com a letra menor mas seguindo as config do h1 -->
            <p class="mb-0">Gerenciamento de Livros e Revistas</p>
        </div>
    </header>


    <main class="container">
        <div id="mensagens" class="alert d-none" role="alert"></div>
    </main>
    <section class="mb-4" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo" class="h5 mb-3">Resumo</h2>
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <p class="card-title text-muted mb-1">Total de materiais</p>
                        <p id="total-materiais" class="display-6 mb-0">0</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <p class="card-title text-muted mb-1">Livros</p>
                        <p id="total-livros" class="display-6 mb-0">0</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <p class="card-title text-muted mb-1">Revistas</p>
                        <p id="total-revistas" class="display-6 mb-0">0</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="mb-4" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro" class="h5 mb-3">Cadastrar material</h2>

        <ul class="nav nav-tabs" id="abas-cadastro" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="aba-livro" data-bs-toggle="tab" data-bs-target="#painel-livro"
                    type="button" role="tab" aria-controls="painel-livro" aria-selected="true">Livro</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="aba-revista" data-bs-toggle="tab" data-bs-target="#painel-revista"
                    type="button" role="tab" aria-controls="painel-revista" aria-selected="false">Revista</button>
            </li>
        </ul>

        <div class="tab-content border border-top-0 p-3">
            <!-- painel do livro -->
            <div class="tab-pane fade show active" id="painel-livro" role="tabpanel" aria-labelledby="aba-livro">
                <form id="form-livro" novalidate></form>
            </div>
            <!-- painel da revista -->
            <div class="tab-pane fade" id="painel-revista" role="tabpanel" aria-labelledby="aba-revista">
                <form id="form-revista" novalidate></form>
            </div>
        </div>
    </section>
    <form id="form-livro" novalidate>
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label for="livro-titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="livro-titulo" name="titulo">
            </div>
            <div class="col-12 col-md-6">
                <label for="livro-autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="livro-autor" name="autor">
            </div>
            <div class="col-6 col-md-3">
                <label for="livro-ano" class="form-label">Ano de publicação</label>
                <input type="number" class="form-control" id="livro-ano" name="ano">
            </div>
            <div class="col-6 col-md-3">
                <label for="livro-paginas" class="form-label">Número de páginas</label>
                <input type="number" class="form-control" id="livro-paginas" name="paginas" min="1">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Cadastrar livro</button>
            </div>
        </div>
    </form>
    <input type="text" class="form-control" id="livro-titulo">
    <div class="invalid-feedback">Informe o título.</div>
    <section class="mb-4" aria-labelledby="titulo-lista">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 id="titulo-lista" class="h5 mb-0">Materiais cadastrados</h2>
            <button id="btn-atualizar" type="button" class="btn btn-outline-secondary btn-sm">Atualizar lista</button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col">Título</th>
                        <th scope="col">Ano</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Detalhes</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-materiais">
                    <!-- linhas geradas pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </section>
    <div class="modal fade" id="modal-edicao" tabindex="-1" aria-labelledby="titulo-modal-edicao" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title h5" id="titulo-modal-edicao">Editar material</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <form id="form-edicao" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="edicao-id">
                        <input type="hidden" id="edicao-tipo">

                        <div class="mb-3">
                            <label for="edicao-titulo" class="form-label">Título</label>
                            <input type="text" class="form-control" id="edicao-titulo">
                        </div>
                        <div class="mb-3">
                            <label for="edicao-ano" class="form-label">Ano de publicação</label>
                            <input type="number" class="form-control" id="edicao-ano">
                        </div>

                        <!-- Campos que só aparecem se for LIVRO -->
                        <div id="edicao-campos-livro">
                            <div class="mb-3">
                                <label for="edicao-autor" class="form-label">Autor</label>
                                <input type="text" class="form-control" id="edicao-autor">
                            </div>
                            <div class="mb-3">
                                <label for="edicao-paginas" class="form-label">Número de páginas</label>
                                <input type="number" class="form-control" id="edicao-paginas" min="1">
                            </div>
                        </div>

                        <!-- Campos que só aparecem se for REVISTA -->
                        <div id="edicao-campos-revista" class="d-none">
                            <div class="mb-3">
                                <label for="edicao-edicao" class="form-label">Número da edição</label>
                                <input type="number" class="form-control" id="edicao-edicao" min="1">
                            </div>
                            <div class="mb-3">
                                <label for="edicao-mes" class="form-label">Mês de publicação</label>
                                <input type="number" class="form-control" id="edicao-mes" min="1" max="12">
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar alterações</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-detalhes" tabindex="-1" aria-labelledby="titulo-modal-detalhes"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="titulo-modal-detalhes">Detalhes do material</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <dl class="mb-0" id="detalhes-conteudo">
                        <!-- o JS preenche -->
                    </dl>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex flex-wrap gap-1">
        <button type="button" class="btn btn-sm btn-outline-primary">Detalhes</button>
        <button type="button" class="btn btn-sm btn-outline-secondary">Descrição e prazo</button>
        <button type="button" class="btn btn-sm btn-outline-success">Emprestar</button>
        <button type="button" class="btn btn-sm btn-warning">Editar</button>
        <button type="button" class="btn btn-sm btn-danger">Excluir</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
